<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda de Estudos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Agenda de Estudos</h1>
    <p>Trabalhos, provas e listas organizados por matéria.</p>
  </header>
  <main>
    <form id="form-tarefa">
      <h2>Nova tarefa</h2>

      <label for="materia">Matéria</label>
      <select id="materia" required></select>

      <label for="tipo">Tipo</label>
      <select id="tipo" required></select>

      <label for="descricao">Descrição</label>
      <input id="descricao" maxlength="120" required>

      <label for="entrega">Data de entrega</label>
      <input id="entrega" type="date" required>

      <button type="submit">Salvar tarefa</button>
      <p id="aviso" role="status"></p>
    </form>

    <h2>Minhas tarefas</h2>
    <label for="filtro-materia">Mostrar matéria</label>
    <select id="filtro-materia">
      <option value="">Todas</option>
    </select>
    <table>
      <thead>
        <tr><th>Entrega</th><th>Matéria</th><th>Tipo</th><th>Descrição</th><th></th></tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
